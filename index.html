<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담벼락 카페 1호점</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-bottom: 20px; }
        
        /* 공지사항 상자 */
        .notice-box {
            background-color: #fff9db;
            border: 2px solid #ffe066;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 20px;
        }
        .notice-textarea {
            width: 100%; height: 60px; border: 1px solid #ffe066;
            background-color: #fffdf5; font-family: inherit; font-size: 14px;
            padding: 10px; border-radius: 5px; box-sizing: border-box; resize: none;
        }
        .save-btn {
            background-color: #f08c00; color: white; border: none;
            padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }

        /* 탭 메뉴 버튼 */
        .tab-menu {
            display: flex;
            justify-content: space-around;
            background: #e9ecef;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: none;
            border: none;
            font-size: 15px;
            font-weight: bold;
            color: #495057;
            padding: 10px;
            border-radius: 5px;
            width: 30%;
        }
        .tab-btn.active {
            background-color: #007bff;
            color: white;
        }

        /* 게시판 본문 내용 상자 */
        .content-box {
            display: none;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            min-height: 300px;
            background: #fff;
            text-align: left;
        }
        .content-box.active { display: block; }

        /* 입력창 스타일 */
        .input-group { margin-bottom: 12px; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; 
            border-radius: 5px; box-sizing: border-box; font-family: inherit;
        }
        .submit-btn {
            background-color: #28a745; color: white; border: none;
            padding: 12px 15px; border-radius: 5px; width: 100%; font-weight: bold; font-size: 16px;
        }

        /* 등록된 글/자료 목록 스타일 */
        .post-list { margin-top: 20px; }
        .post-item {
            background: #f8f9fa; border: 1px solid #e9ecef;
            padding: 15px; margin-bottom: 15px; border-radius: 8px;
        }
        .post-meta { font-size: 12px; color: #666; font-weight: bold; margin-bottom: 8px; }
        .post-content { font-size: 15px; color: #333; margin-bottom: 10px; line-height: 1.4; }

        /* 댓글 영역 스타일 */
        .comment-section {
            background: #fff; padding: 10px; border-radius: 5px; border: 1px solid #eee; margin-top: 10px;
        }
        .comment-item {
            font-size: 13px; border-bottom: 1px dashed #eee; padding: 5px 0;
        }
        .comment-form { display: flex; margin-top: 8px; gap: 5px; }
        .comment-form input {
            padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;
        }
        .comment-btn {
            background: #17a2b8; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>☕ 담벼락 카페</h1>

    <div class="notice-box">
        <h3 style="margin:0 0 10px 0; color:#f08c00;">📢 이용 안내 공지사항 
            <button class="save-btn" onclick="saveNotice()">💾 저장</button>
        </h3>
        <textarea id="noticeInput" class="notice-textarea" placeholder="공지사항을 적어주세요."></textarea>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('home')">🏡 홈 대문</button>
        <button class="tab-btn" onclick="switchTab('board')">💬 자유게시판</button>
        <button class="tab-btn" onclick="switchTab('archive')">📂 자료실</button>
    </div>

    <div id="home" class="content-box active">
        <h3 style="text-align: center; color: #007bff; margin-top: 50px;">👋 담벼락 카페에 오신 것을 환영합니다!</h3>
        <p style="text-align: center; color: #555;">손님들이 남긴 글에 댓글을 달아주거나 자료실을 이용해 보세요.</p>
    </div>

    <div id="board" class="content-box">
        <h3>💬 자유게시판 글쓰기</h3>
        <div class="input-group"><input type="text" id="regName" placeholder="닉네임 입력"></div>
        <div class="input-group"><textarea id="regContent" placeholder="여기에 자유롭게 글을 남겨주세요!"></textarea></div>
        <button class="submit-btn" onclick="addPost()">✍️ 글 등록하기</button>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <h4>📋 등록된 글 목록</h4>
        <div id="postList" class="post-list"></div>
    </div>

    <div id="archive" class="content-box">
        <h3>📂 파일 자료실 등록</h3>
        <div class="input-group"><input type="text" id="fileTitle" placeholder="자료 제목 입력"></div>
        <div class="input-group"><textarea id="fileDesc" placeholder="자료에 대한 상세 설명을 적어주세요."></textarea></div>
        <div class="input-group">
            <input type="file" id="fileInput">
        </div>
        <button class="submit-btn" style="background-color: #007bff;" onclick="uploadFile()">📤 자료 등록하기</button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <h4>📦 공유된 파일 목록</h4>
        <div id="fileList" class="post-list"></div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.content-box').forEach(box => box.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(tabId === 'home') document.querySelectorAll('.tab-btn')[0].classList.add('active');
        if(tabId === 'board') document.querySelectorAll('.tab-btn')[1].classList.add('active');
        if(tabId === 'archive') document.querySelectorAll('.tab-btn')[2].classList.add('active');
    }

    window.onload = function() {
        const savedNotice = localStorage.getItem('cafeNotice');
        document.getElementById('noticeInput').value = savedNotice ? savedNotice : "우리 카페에 오신 것을 환영합니다! 매너 소통 부탁드립니다.";
        loadPosts();
        loadFiles();
    }
    function saveNotice() {
        localStorage.setItem('cafeNotice', document.getElementById('noticeInput').value);
        alert('📢 공지사항이 저장되었습니다!');
    }

    // [자유게시판] 원글 등록 (아이디 부여)
    function addPost() {
        const name = document.getElementById('regName').value.trim();
        const content = document.getElementById('regContent').value.trim();
        if(!name || !content) { alert('닉네임과 내용을 모두 입력해 주세요!'); return; }

        let posts = JSON.parse(localStorage.getItem('cafePosts')) || [];
        const postId = Date.now(); // 글 구분을 위한 고유 번호
        posts.unshift({ id: postId, name: name, content: content, date: new Date().toLocaleString(), comments: [] });
        localStorage.setItem('cafePosts', JSON.stringify(posts));
        
        document.getElementById('regName').value = '';
        document.getElementById('regContent').value = '';
        loadPosts();
    }

    // [자유게시판] 목록 및 댓글창 화면 표시
    function loadPosts() {
        const posts = JSON.parse(localStorage.getItem('cafePosts')) || [];
        const listDiv = document.getElementById('postList');
        listDiv.innerHTML = posts.length === 0 ? '<p style="color:#aaa;">첫 글을 남겨보세요!</p>' : '';
        
        posts.forEach(p => {
            let commentHtml = '';
            p.comments.forEach(c => {
                commentHtml += `<div class="comment-item"><b>${c.name}:</b> ${c.content} <span style="font-size:10px;color:#aaa;">(${c.date})</span></div>`;
            });

            listDiv.innerHTML += `
                <div class="post-item">
                    <div class="post-meta">👤 ${p.name} (${p.date})</div>
                    <div class="post-content">${p.content}</div>
                    
                    <div class="comment-section">
                        <div id="comments-${p.id}">${commentHtml ? commentHtml : '<p style="color:#bbb; font-size:12px; margin:0;">첫 댓글을 달아보세요!</p>'}</div>
                        <div class="comment-form">
                            <input type="text" id="cName-${p.id}" placeholder="이름" style="width:25%;">
                            <input type="text" id="cContent-${p.id}" placeholder="댓글 내용을 입력하세요" style="width:60%;">
                            <button class="comment-btn" onclick="addComment(${p.id})">답글</button>
                        </div>
                    </div>
                </div>`;
        });
    }

    // [자유게시판] 댓글 등록 기능
    function addComment(postId) {
        const cName = document.getElementById(`cName-${postId}`).value.trim();
        const cContent = document.getElementById(`cContent-${postId}`).value.trim();
        if(!cName || !cContent) { alert('댓글 이름과 내용을 적어주세요!'); return; }

        let posts = JSON.parse(localStorage.getItem('cafePosts')) || [];
        const postIndex = posts.findIndex(p => p.id === postId);
        
        if(postIndex !== -1) {
            posts[postIndex].comments.push({
                name: cName,
                content: cContent,
                date: new Date().toLocaleTimeString()
            });
            localStorage.setItem('cafePosts', JSON.stringify(posts));
            loadPosts();
        }
    }

    // [자료실] 제목 + 설명 + 파일 등록 기능
    function uploadFile() {
        const title = document.getElementById('fileTitle').value.trim();
        const desc = document.getElementById('fileDesc').value.trim();
        const fileInput = document.getElementById('fileInput');
        
        if(!title || !desc) { alert('자료 제목과 설명을 먼저 적어주세요!'); return; }
        if(!fileInput.files.length) { alert('업로드할 파일을 선택해 주세요!'); return; }
        
        const file = fileInput.files[0];
        let files = JSON.parse(localStorage.getItem('cafeFiles')) || [];
        files.unshift({ 
            title: title,
            desc: desc,
            fileName: file.name, 
            size: (file.size/1024).toFixed(1) + ' KB', 
            date: new Date().toLocaleString() 
        });
        localStorage.setItem('cafeFiles', JSON.stringify(files));
        
        document.getElementById('fileTitle').value = '';
        document.getElementById('fileDesc').value = '';
        fileInput.value = '';
        alert('📤 설명이 포함된 자료가 성공적으로 등록되었습니다!');
        loadFiles();
    }

    // [자료실] 목록 표시
    function loadFiles() {
        const files = JSON.parse(localStorage.getItem('cafeFiles')) || [];
        const listDiv = document.getElementById('fileList');
        listDiv.innerHTML = files.length === 0 ? '<p style="color:#aaa;">공유된 자료가 없습니다.</p>' : '';
        
        files.forEach(f => {
            listDiv.innerHTML += `
                <div class="post-item" style="border-left: 4px solid #17a2b8;">
                    <div style="font-size:16px; font-weight:bold; color:#111;">📋 제목: ${f.title}</div>
                    <div style="font-size:12px; color:#666; margin:5px 0;">등록일: ${f.date}</div>
                    <div style="background:#fff; padding:10px; border-radius:5px; margin:8px 0; font-size:14px; border:1px solid #eee;">
                        <b>설명:</b> ${f.desc}
                    </div>
                    <div class="post-meta" style="margin-bottom:0; color:#007bff;">
                        📎 첨부파일: ${f.fileName} (${f.size}) 
                        <span style="margin-left:10px; background:#e2e6ea; padding:2px 6px; border-radius:3px; color:#333; font-size:11px;">💾 다운로드 가능</span>
                    </div>
                </div>`;
        });
    }
</script>

</body>
</html>
