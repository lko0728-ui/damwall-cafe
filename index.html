<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담벼락 카페</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-bottom: 20px; }
        
        /* 홈 바로가기 버튼 */
        .home-btn {
            display: inline-block;
            background-color: #6c757d;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* 탭 메뉴 (게시판 전환 버튼) */
        .tab-menu {
            display: flex;
            justify-content: space-around;
            background: #e9ecef;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .tab-btn.active {
            background-color: #007bff;
            color: white;
        }

        /* 게시판 보여주는 상자 */
        .content-box {
            display: none;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 10px;
            height: 500px;
            background: #fff;
        }
        .content-box.active { display: block; }

        iframe { width: 100%; height: 100%; border: none; }

        /* 최상단 공지사항 상자 */
        .notice-box {
            background-color: #fff9db;
            border: 2px solid #ffe066;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 20px;
        }
        .notice-textarea {
            width: 100%; height: 80px; border: 1px solid #ffe066;
            background-color: #fffdf5; font-family: inherit; font-size: 14px;
            padding: 10px; border-radius: 5px; box-sizing: border-box; resize: none;
        }
        .save-btn {
            background-color: #f08c00; color: white; border: none;
            padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="#" class="home-btn" onclick="switchTab('home')">🏠 홈으로 바로가기</a>
    <h1>☕ 담벼락 카페</h1>

    <div id="noticeArea" class="notice-box">
        <h3 style="margin:0 0 10px 0; color:#f08c00;">📢 이용 안내 공지사항 
            <button class="save-btn" onclick="saveNotice()">💾 저장</button>
        </h3>
        <textarea id="noticeInput" class="notice-textarea" placeholder="공지사항을 입력하세요."></textarea>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('home')">🏡 홈 대문</button>
        <button class="tab-btn" onclick="switchTab('member')">🔐 회원가입/로그인</button>
        <button class="tab-btn" onclick="switchTab('board')">💬 자유게시판</button>
        <button class="tab-btn" onclick="switchTab('archive')">📂 파일 자료실</button>
    </div>

    <div id="home" class="content-box active">
        <div style="padding-top: 100px; font-size: 18px;">
            <p>👋 안녕하세요, 대장님! 성공적으로 로그인되었습니다.</p>
            <p>상단 메뉴에서 원하시는 방을 선택해 이동해 보세요! 😎</p>
        </div>
    </div>

    <div id="member" class="content-box">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfD_lM9y1lB3XkXFf1Z-gG_JqgZ0z3XmCqX-fXhG-XwXwXwXw/viewform?embedded=true">Loading…</iframe>
    </div>

    <div id="board" class="content-box">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfD_lM9y1lB3XkXFf1Z-gG_JqgZ0z3XmCqX-fXhG-XwXwXwXw/viewform?embedded=true">Loading…</iframe>
    </div>

    <div id="archive" class="content-box">
        <iframe src="https://drive.google.com/embeddedfolderview?id=📌구글폴더ID">📂 구글 자료실 연동 준비중입니다.</iframe>
    </div>
</div>

<script>
    // 메뉴 전환 기능
    function switchTab(tabId) {
        document.querySelectorAll('.content-box').forEach(box => box.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        
        if(tabId === 'home') document.querySelectorAll('.tab-menu .tab-btn')[0].classList.add('active');
        if(tabId === 'member') document.querySelectorAll('.tab-menu .tab-btn')[1].classList.add('active');
        if(tabId === 'board') document.querySelectorAll('.tab-menu .tab-btn')[2].classList.add('active');
        if(tabId === 'archive') document.querySelectorAll('.tab-menu .tab-btn')[3].classList.add('active');

        // 홈이 아니면 공지사항 잠시 숨겨서 화면 넓게 쓰기
        if(tabId === 'home') document.getElementById('noticeArea').style.display = 'block';
        else document.getElementById('noticeArea').style.display = 'none';
    }

    // 공지사항 저장 기능
    window.onload = function() {
        const savedNotice = localStorage.getItem('cafeNotice');
        if (savedNotice) document.getElementById('noticeInput').value = savedNotice;
        else document.getElementById('noticeInput').value = "우리 카페에 오신 것을 환영합니다!";
    }
    function saveNotice() {
        localStorage.setItem('cafeNotice', document.getElementById('noticeInput').value);
        alert('📢 공지사항이 저장되었습니다!');
    }
</script>

</body>
</html>
