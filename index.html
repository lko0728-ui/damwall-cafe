<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담벼락 카페 1호점</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-bottom: 20px; }
        
        /* 공지사항 */
        .notice-box {
            background-color: #fff9db;
            border: 2px solid #ffe066;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 20px;
        }

        /* 메뉴 버튼 */
        .tab-menu {
            display: flex;
            justify-content: space-around;
            background: #e9ecef;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: none; border: none; font-size: 15px; font-weight: bold;
            color: #495057; padding: 10px; border-radius: 5px; cursor: pointer; width: 45%;
        }
        .tab-btn.active { background-color: #28a745; color: white; }

        .content-box { display: none; min-height: 500px; }
        .content-box.active { display: block; }

        /* 파일 업로드 안내 박스 */
        .file-upload-box {
            background-color: #e8f4fd;
            border: 1px solid #b1d7fa;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 15px;
        }
        .upload-link {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>☕ 담벼락 카페 1호점</h1>

    <div class="notice-box">
        <h3 style="margin:0 0 5px 0; color:#f08c00;">📢 오픈 기념 공지사항</h3>
        <p style="margin:0; font-size:14px; color:#333;">로그인 없이 이용 가능한 실시간 자유게시판과 자료실을 오픈했습니다!</p>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('board')">💬 1. 실시간 자유게시판</button>
        <button class="tab-btn" onclick="switchTab('archive')">📂 2. 카페 자료실</button>
    </div>

    <div id="board" class="content-box active">
        <h3 style="text-align: left; color:#333;">✍️ 자유게시판 글 남기기</h3>
        <p style="text-align: left; font-size:13px; color:#666;">아래 창에 이름과 글을 쓰고 [제출]을 누르면 실시간으로 전달됩니다!</p>
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeUDwUOEwFSj3gA7EWoVd0j6iroa9beZ7nX9-i9SjmCiTIlYg/viewform?embedded=true" width="100%" height="600" frameborder="0" marginheight="0" marginwidth="0">지정된 게시판 로딩 중...</iframe>
    </div>

    <div id="archive" class="content-box">
        <h3 style="text-align: left; color:#333;">📂 자료실 글 쓰기 및 파일 공유</h3>
        
        <div class="file-upload-box">
            <p style="margin:0 0 5px 0; font-size:14px; color:#004085; font-weight:bold;">📎 사진이나 파일을 공유하는 방법 (로그인 없음)</p>
            <p style="margin:0; font-size:13px; color:#333;">1. 아래 버튼을 눌러 파일이나 사진을 먼저 올린 뒤, <b>주소(링크)를 복사</b>하세요.</p>
            <p style="margin:5px 0; font-size:13px; color:#333;">2. 복사한 주소를 아래 글쓰기 창 [남기실 말씀] 칸에 붙여넣어 제출하면 끝!</p>
            <a href="https://imgur.com/upload" target="_blank" class="upload-link">📸 사진/파일 무료 올리기 링크</a>
        </div>
        
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeUDwUOEwFSj3gA7EWoVd0j6iroa9beZ7nX9-i9SjmCiTIlYg/viewform?embedded=true" width="100%" height="500" frameborder="0" marginheight="0" marginwidth="0">자료실 로딩 중...</iframe>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.content-box').forEach(box => box.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        
        const btns = document.querySelectorAll('.tab-btn');
        if(tabId === 'board') btns[0].classList.add('active');
        if(tabId === 'archive') btns[1].classList.add('active');
    }
</script>

</body>
</html>
