<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담벼락 카페 1호점</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-bottom: 20px; }
        
        /* 공지사항 */
        .notice-box {
            background-color: #fff9db;
            border: 2px solid #ffe066;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 25px;
        }

        .content-box { min-height: 500px; }
    </style>
</head>
<body>

<div class="container">
    <h1>☕ 담벼락 카페 1호점</h1>

    <div class="notice-box">
        <h3 style="margin:0 0 5px 0; color:#f08c00;">📢 오픈 기념 공지사항</h3>
        <p style="margin:0; font-size:14px; color:#333;">정식 실시간 소통 자유게시판을 오픈했습니다! 아래에서 자유롭게 글을 남겨주세요.</p>
    </div>

    <div class="content-box">
        <h3 style="text-align: left; color:#333;">💬 실시간 자유게시판</h3>
        <p style="text-align: left; font-size:13px; color:#666;">아래 창에 이름과 글을 쓰고 [제출]을 누르면 대장님에게 실시간으로 안전하게 전달됩니다!</p>
        
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeUDwUOEwFSj3gA7EWoVd0j6iroa9beZ7nX9-i9SjmCiTIlYg/viewform?embedded=true" width="100%" height="650" frameborder="0" marginheight="0" marginwidth="0">지정된 게시판 로딩 중...</iframe>
    </div>
</div>

</body>
</html>
