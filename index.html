<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담벼락 카페</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        /* 홈 바로가기 버튼 */
        .home-btn {
            display: inline-block;
            background-color: #6c757d;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .home-btn:hover {
            background-color: #5a6268;
        }
        /* 최상단 공지사항 상자 */
        .notice-box {
            background-color: #fff9db;
            border: 2px solid #ffe066;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 30px;
        }
        .notice-box h3 {
            margin-top: 0;
            color: #f08c00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* 내가 직접 타이핑하는 입력창 */
        .notice-textarea {
            width: 100%;
            height: 120px;
            border: 1px solid #ffe066;
            background-color: #fffdf5;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 5px;
        }
        .save-btn {
            background-color: #f08c00;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .save-btn:hover {
            background-color: #e07b00;
        }
        .welcome-msg {
            font-size: 18px;
            color: #444;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="home-btn">🏠 홈으로 바로가기</a>

    <h1>☕ 담벼락 카페 </h1>

    <div class="notice-box">
        <h3>📢 이용 안내 공지사항 (운영자 편집 가능) 
            <button class="save-btn" onclick="saveNotice()">💾 공지 저장하기</button>
        </h3>
        <textarea id="noticeInput" class="notice-textarea" placeholder="여기에 지인들에게 보여줄 공지사항을 직접 타이핑해서 작성하세요!"></textarea>
    </div>

    <div class="welcome-msg">
        <p>👋 안녕하세요, 대장님! 성공적으로 로그인되었습니다.</p>
        <p>우리들만의 따뜻한 아지트에서 즐거운 시간 보내세요! 😎</p>
    </div>
</div>

<script>
    // 페이지가 켜지면 저장되어 있던 공지사항을 자동으로 불러옵니다.
    window.onload = function() {
        const savedNotice = localStorage.getItem('cafeNotice');
        if (savedNotice) {
            document.getElementById('noticeInput').value = savedNotice;
        } else {
            // 처음 켰을 때 보여줄 기본 문구
            document.getElementById('noticeInput').value = "우리 카페에 오신 것을 환영합니다!\n1. 가입 후 인사글 남기기\n2. 매너 장착 필수! \n\n(이 내용을 지우고 원하는 공지를 타이핑해 보세요!)";
        }
    }

    // [공지 저장하기] 버튼을 누르면 입력한 글이 컴퓨터에 저장됩니다.
    function saveNotice() {
        const noticeText = document.getElementById('noticeInput').value;
        localStorage.setItem('cafeNotice', noticeText);
        alert('📢 공지사항이 안전하게 저장되었습니다!');
    }
</script>

</body>
</html>
