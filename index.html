<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담벼락 카페 1호점</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-bottom: 20px; }
        
        /* 공지사항 상자 */
        .notice-box {
            background-color: #fff9db;
            border: 2px solid #ffe066;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 20px;
        }
        .notice-textarea {
            width: 100%; height: 60px; border: 1px solid #ffe066;
            background-color: #fffdf5; font-family: inherit; font-size: 14px;
            padding: 10px; border-radius: 5px; box-sizing: border-box; resize: none;
        }
        .save-btn {
            background-color: #f08c00; color: white; border: none;
            padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }

        /* 탭 메뉴 버튼 */
        .tab-menu {
            display: flex;
            justify-content: space-around;
            background: #e9ecef;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: none;
            border: none;
            font-size: 15px;
            font-weight: bold;
            color: #495057;
            padding: 10px;
            border-radius: 5px;
            width: 30%;
        }
        .tab-btn.active {
            background-color: #007bff;
            color: white;
        }

        /* 게시판 본문 내용 상자 */
        .content-box {
            display: none;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            min-height: 300px;
            background: #fff;
            text-align: left;
        }
        .content-box.active { display: block; }

        /* 글쓰기 폼 스타일 */
        .input-group {
            margin-bottom: 15px;
        }
        .input-group input, .input-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; 
            border-radius: 5px; box-sizing: border-box;
        }
        .submit-btn {
            background-color: #28a745; color: white; border: none;
            padding: 10px 15px; border-radius: 5px; width: 100%; font-weight: bold;
        }

        /* 등록된 글 목록 스타일 */
        .post-list {
            margin-top: 20px; max-height: 200px; overflow-y: auto;
        }
        .post-item {
            background: #f8f9fa; border-bottom: 1px solid #eee; 
            padding: 10px; margin-bottom: 10px; border-radius: 5px;
        }
        .post-meta { font-size: 12px; color: #666; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>☕ 담벼락 카페</h1>

    <!-- [1] 공지사항 상자 -->
    <div class="notice-box">
        <h3 style="margin:0 0 10px 0; color:#f08c00;">📢 이용 안내 공지사항 
            <button class="save-btn" onclick="saveNotice()">💾 저장</button>
        </h3>
        <textarea id="noticeInput" class="notice-textarea" placeholder="공지사항을 적어주세요."></textarea>
    </div>

    <!-- [2] 메뉴 버튼 (홈, 자유게시판, 자료실) -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('home')">🏡 홈 대문</button>
        <button class="tab-btn" onclick="switchTab('board')">💬 자유게시판</button>
        <button class="tab-btn" onclick="switchTab('archive')">📂 자료실</button>
    </div>

    <!-- [3] 실제 기능이 작동하는 방들 -->
    <!-- 홈 대문 방 -->
    <div id="home" class="content-box active">
        <h3 style="text-align: center; color: #007bff; margin-top: 50px;">👋 담벼락 카페에 오신 것을 환영합니다!</h3>
        <p style="text-align: center; color: #555;">상단 메뉴를 눌러 자유게시판과 자료실을 이용해 보세요.</p>
    </div>

    <!-- 자유게시판 방 -->
    <div id="board" class="content-box">
        <h3>💬 자유게시판 글쓰기</h3>
        <div class="input-group"><input type="text" id="regName" placeholder="닉네임 입력"></div>
        <div class="input-group"><textarea id="regContent" placeholder="여기에 자유롭게 글을 남겨주세요!"></textarea></div>
        <button class="submit-btn" onclick="addPost()">✍️ 글 등록하기</button>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <h4>📋 등록된 글 목록</h4>
        <div id="postList" class="post-list"></div>
    </div>

    <!-- 자료실 방 -->
    <div id="archive" class="content-box">
        <h3>📂 파일 자료실</h3>
        <p style="color: #666; font-size: 14px;">카페 회원들과 공유할 파일을 선택해 주세요.</p>
        <div class="input-group">
            <input type="file" id="fileInput">
        </div>
        <button class="submit-btn" style="background-color: #17a2b8;" onclick="uploadFile()">📤 파일 업로드</button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <h4>📦 공유된 파일 목록</h4>
        <div id="fileList" class="post-list"></div>
    </div>
</div>

<script>
    // 메뉴 전환 기능 (키보드 대응)
    function switchTab(tabId) {
        document.querySelectorAll('.content-box').forEach(box => box.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        
        if(tabId === 'home') document.querySelectorAll('.tab-btn')[0].classList.add('active');
        if(tabId === 'board') document.querySelectorAll('.tab-btn')[1].classList.add('active');
        if(tabId === 'archive') document.querySelectorAll('.tab-btn')[2].classList.add('active');
    }

    // 공지사항 로직
    window.onload = function() {
        const savedNotice = localStorage.getItem('cafeNotice');
        document.getElementById('noticeInput').value = savedNotice ? savedNotice : "우리 카페에 오신 것을 환영합니다! 매너 소통 부탁드립니다.";
        loadPosts();
        loadFiles();
    }
    function saveNotice() {
        localStorage.setItem('cafeNotice', document.getElementById('noticeInput').value);
        alert('📢 공지사항이 저장되었습니다!');
    }

    // [자유게시판] 글쓰기 기능
    function addPost() {
        const name = document.getElementById('regName').value.trim();
        const content = document.getElementById('regContent').value.trim();
        if(!name || !content) { alert('닉네임과 내용을 모두 입력해 주세요!'); return; }

        let posts = JSON.parse(localStorage.getItem('cafePosts')) || [];
        posts.unshift({ name: name, content: content, date: new Date().toLocaleString() });
        localStorage.setItem('cafePosts', JSON.stringify(posts));
        
        document.getElementById('regName').value = '';
        document.getElementById('regContent').value = '';
        loadPosts();
    }
    function loadPosts() {
        const posts = JSON.parse(localStorage.getItem('cafePosts')) || [];
        const listDiv = document.getElementById('postList');
        listDiv.innerHTML = posts.length === 0 ? '<p style="color:#aaa;">첫 글을 남겨보세요!</p>' : '';
        posts.forEach(p => {
            listDiv.innerHTML += `<div class="post-item"><div class="post-meta">👤 ${p.name} (${p.date})</div><div style="margin-top:5px;">${p.content}</div></div>`;
        });
    }

    // [자료실] 파일 업로드 기능
    function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        if(!fileInput.files.length) { alert('업로드할 파일을 먼저 선택해 주세요!'); return; }
        
        const file = fileInput.files[0];
        let files = JSON.parse(localStorage.getItem('cafeFiles')) || [];
        files.unshift({ name: file.name, size: (file.size/1024).toFixed(1) + ' KB', date: new Date().toLocaleDateString() });
        localStorage.setItem('cafeFiles', JSON.stringify(files));
        
        fileInput.value = '';
        alert('📤 파일이 자료실에 성공적으로 등록되었습니다!');
        loadFiles();
    }
    function loadFiles() {
        const files = JSON.parse(localStorage.getItem('cafeFiles')) || [];
        const listDiv = document.getElementById('fileList');
        listDiv.innerHTML = files.length === 0 ? '<p style="color:#aaa;">공유된 파일이 없습니다.</p>' : '';
        files.forEach(f => {
            listDiv.innerHTML += `<div class="post-item"><div class="post-meta">📂 ${f.name} (${f.size})</div><div style="font-size:12px; color:#007bff; margin-top:5px; cursor:pointer;">💾 다운로드 (준비됨)</div></div>`;
        });
    }
</script>

</body>
</html>
