<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담벼락 카페 1호점</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-bottom: 20px; }
        
        /* 공지사항 */
        .notice-box {
            background-color: #fff9db;
            border: 2px solid #ffe066;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            margin-bottom: 20px;
        }

        /* 메뉴 버튼 */
        .tab-menu {
            display: flex;
            justify-content: space-around;
            background: #e9ecef;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: none; border: none; font-size: 15px; font-weight: bold;
            color: #495057; padding: 10px; border-radius: 5px; cursor: pointer; width: 45%;
        }
        .tab-btn.active { background-color: #007bff; color: white; }

        .content-box { display: none; min-height: 450px; }
        .content-box.active { display: block; }

        /* 긴급 카톡 버튼 */
        .kakao-btn {
            display: block; background-color: #fee500; color: #191919;
            font-size: 18px; font-weight: bold; text-decoration: none;
            padding: 15px; margin: 15px 0; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>☕ 담벼락 카페 1호점</h1>

    <div class="notice-box">
        <h3 style="margin:0 0 5px 0; color:#f08c00;">📢 오픈 기념 공지사항</h3>
        <p style="margin:0; font-size:14px; color:#333;">정식 실시간 소통 게시판을 오픈했습니다! 아래에서 자유롭게 글을 남겨주세요.</p>
    </div>

    <!-- 메뉴 선택 -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('board')">💬 1. 실시간 자유게시판</button>
        <button class="tab-btn" onclick="switchTab('chat')">🔥 2. 실시간 단톡방</button>
    </div>

    <!-- 1. 구글 실시간 게시판 탑재 공간 -->
    <div id="board" class="content-box active">
        <h3 style="text-align: left; color:#333;">✍️ 자유게시판 글 남기기</h3>
        <p style="text-align: left; font-size:13px; color:#666;">아래 창에 이름과 글을 쓰고 [제출]을 누르면 대장님에게 실시간으로 전달됩니다!</p>
        
        <!-- 파티 질문 없는 깔끔한 새 링크로 교체 완료! -->
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeUDwUOEwFSj3gA7EWoVd0j6iroa9beZ7nX9-i9SjmCiTIlYg/viewform?embedded=true" width="100%" height="600" frameborder="0" marginheight="0" marginwidth="0">지정된 게시판 로딩 중...</iframe>
    </div>

    <!-- 2. 카카오톡 채팅방 이동 공간 -->
    <div id="chat" class="content-box">
        <h3 style="text-align: left; color:#333;">💬 담벼락 카카오톡 오픈채팅방</h3>
        <p style="text-align: left; font-size:13px; color:#666;">웹사이트 글쓰기보다 더 빠른 실시간 수다를 원하시면 아래 버튼을 눌러 들어오세요!</p>
        
        <a href="https://open.kakao.com/" target="_blank" class="kakao-btn">💛 대장님과 실시간 카톡방 입장하기</a>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.content-box').forEach(box => box.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        
        const btns = document.querySelectorAll('.tab-btn');
        if(tabId === 'board') btns[0].classList.add('active');
        if(tabId === 'chat') btns[1].classList.add('active');
    }
</script>

</body>
</html>
