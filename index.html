<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담벼락 카페 1호점</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 20px;
            line-height: 2.0;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            border: 3px solid #000000;
            padding: 30px;
            text-align: center;
        }
        h1 { font-size: 28px; color: #000000; border-bottom: 3px solid #000; padding-bottom: 15px; }
        
        .box {
            background-color: #f8f9fa;
            border: 2px solid #000000;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }
        /* 스크린 리더와 저시력 회원님들을 위한 고대비 대형 버튼 */
        .main-btn {
            display: block;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            padding: 25px;
            border-radius: 10px;
            border: 2px solid #000000;
            margin: 30px 0;
        }
        .main-btn:hover, .main-btn:focus {
            background-color: #ffffff;
            color: #0000ee;
            border: 4px solid #0000ee;
            outline: none;
        }
    </style>

    <script>
        if (window.top !== window.self) {
            window.top.location.replace(window.self.location.href);
        }
    </script>
</head>
<body>

<div class="container">
    <h1>☕ 담벼락 카페 1호점 단독 홈페이지</h1>

    <div class="box" role="region" aria-label="안내">
        <h2 style="font-size: 20px; margin-top: 0; color: #ff0000;">📢 중요 안내 사항</h2>
        <p>우리 카페는 넓은마을 게시판이나 다른 사람의 채널 글과 절대 섞이지 않는 <b>대장님 단독 관리 공간</b>입니다.</p>
        <p style="margin-top: 10px;">아래 버튼을 누르시면 다른 메뉴와 겹치지 않고, 대장님이 오늘 새로 개설하신 <b>[깨끗한 담벼락 방명록 구글 창]</b>으로 안전하게 이동하여 로그인 없이 즉시 글을 남기실 수 있습니다.</p>
    </div>

    <a href="https://forms.google.com" class="main-btn" title="담벼락 카페 실시간 글쓰기 창으로 이동하기">
        👉 여기를 눌러서 [실시간 자유게시판 글쓰기] 입장하기
    </a>

    <p style="font-size: 15px; color: #555;">※ 복잡한 회원가입 없이 닉네임과 남기실 말씀만 적고 제출하시면 완료됩니다.</p>
</div>

</body>
</html>
