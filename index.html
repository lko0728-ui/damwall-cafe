<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담벼락 카페 1호점 - 초간편 자료실</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #000000; /* 시각장애인 보호용 고대비 검정 배경 */
            color: #ffffff; /* 선명한 흰색 글씨 */
            margin: 0;
            padding: 20px;
            line-height: 2.0;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            border: 4px solid #ffffff;
            padding: 30px;
        }
        h1 { font-size: 28px; color: #ffff00; border-bottom: 4px solid #ffff00; padding-bottom: 15px; text-align: center; }
        
        /* 입력창 상자 스타일 */
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #ffff00; /* 항목 이름은 노란색 */
            margin-bottom: 5px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            background-color: #222222;
            color: #ffffff;
            border: 2px solid #ffffff;
            box-sizing: border-box;
        }
        /* 파일 첨부 버튼 디자인 크고 선명하게 */
        input[type="file"] {
            font-size: 18px;
            color: #ffffff;
            padding: 10px 0;
        }
        
        /* 대형 등록 버튼 */
        .submit-btn {
            display: block;
            width: 100%;
            background-color: #ffff00;
            color: #000000;
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            border: none;
            cursor: pointer;
            margin-top: 30px;
        }
        .submit-btn:hover, .submit-btn:focus {
            background-color: #ffffff;
            color: #ff0000;
            outline: 3px solid #ff0000;
        }
    </style>
    
    <script>
        if (window.top !== window.self) {
            window.top.location.replace(window.self.location.href);
        }
    </script>
</head>
<body>

<div class="container">
    <h1>📂 담벼락 카페 1호점 - 초간편 자료실</h1>
    
    <p style="font-size: 18px; color: #00ffff; text-align: left; margin-bottom: 30px;">
        ※ 탭 키를 누르면서 제목과 설명을 적고 파일(사진/문서)을 첨부한 뒤 등록 버튼을 누르세요.
    </p>

    <form id="archiveForm" onsubmit="uploadData(event)">
        
        <div class="form-group">
            <label for="fileTitle">1. 자료 제목을 적어주세요</label>
            <input type="text" id="fileTitle" placeholder="예: 추천 음악 파일입니다" required>
        </div>

        <div class="form-group">
            <label for="fileDesc">2. 자료에 대한 설명을 적어주세요</label>
            <textarea id="fileDesc" rows="4" placeholder="예: 가요 명곡 모음집입니다. 편하게 들으세요." required></textarea>
        </div>

        <div class="form-group">
            <label for="fileAttach">3. 올릴 파일이나 사진을 선택하세요</label>
            <input type="file" id="fileAttach" required>
        </div>

        <button type="submit" class="submit-btn">🟢 4. 자료실에 파일 등록하기</button>

    </form>
</div>

<script>
    function uploadData(event) {
        event.preventDefault();
        
        const title = document.getElementById('fileTitle').value;
        const file = document.getElementById('fileAttach').files[0].name;
        
        // 파일이 성공적으로 접수되었음을 소리로 확실하게 안내
        alert("🎉 자료 등록 완료!\n\n[제목]: " + title + "\n[첨부된 파일]: " + file + "\n\n대장님 전용 자료실 서버로 안전하게 전송되었습니다!");
        
        // 입력창 초기화
        document.getElementById('archiveForm').reset();
    }
</script>

</body>
</html>
